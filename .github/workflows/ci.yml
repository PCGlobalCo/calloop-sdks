# Runs in the public repo PCGlobalCo/calloop-sdks on every sync and pull
# request: the packages must still pack, analyze and pass their tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  npm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [agent-js, agent-react]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm pack --dry-run
        working-directory: ${{ matrix.dir }}

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run
